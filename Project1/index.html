<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="play">
    <h1>Stone Paper & Scissors</h1>
    <div class="choice">
    <div class="images">
        <img src="scissors.png" alt="" id="scissors">
        <img src="rock.png" alt="" id="rock">
        <img src="paper.png" alt="" id="paper">
    </div>
        <h2>Choose Any Option</h2>
    </div>
    <div class="scoreboard">
        <div class="yourscore">
            <h2>Your Score</h2>
            <h2 id="scr1">0</h2>
        </div>
        <div class="computerscore">
            <h2>Computer Score</h2>
            <h2 id="scr2">0</h2>
        </div>
    </div>
    </div>
    <!-- battles    -->
     <!-- battle 1 -->
      <div class="battle-main-1">
    <div class="battle">
        <h2 class="battle-result">Battle Result</h2>
        <div class="usr">
            <img src="scissors.png" alt="" id="btlimg1">

        </div>
        <div class="comp">
            <img src="rock.png" alt="" id="btlimg2">

        </div>
            <h2 id="you-lost">You Have lost</h2>
    </div>
    </div>
         <!-- battle 2 -->
      <div class="battle-main-2">
    <div class="battle">
        <h2 class="battle-result">Battle Result</h2>
        <div class="usr">
            <img src="#" alt="" id="btlimg3">

        </div>
        <div class="comp">
            <img src="#" alt="" id="btlimg4">

        </div>
        <h2 id="you-won">You Won</h2>
    </div>
    </div>
    <!-- battle 3 (draw) -->
     <!-- <div class="battle-main-3">
        <div class="battle">
    <div class="draw">
        <h2 class="draw">Its A Draw</h2>
    </div>
    </div>
    </div> -->

    <div class="battle-main-3">
    <div class="battle">
        <h2 class="battle-result">Battle Result</h2>
        <h2 id="draw">Its a Draw</h2>
    </div>
    </div>

<script src="script.js"></script>
</body>
</html>
